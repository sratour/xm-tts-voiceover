name: Service health check

# This project rides on an undocumented Microsoft endpoint that can change or
# disappear without notice. A daily probe turns "users report it's broken" into
# "an issue was opened automatically, hours earlier".

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai, every day
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe the live speech endpoint
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Probe the service
        id: probe
        continue-on-error: true
        run: python tests/smoke_test.py

      - name: Collect diagnostics
        if: steps.probe.outcome == 'failure'
        continue-on-error: true
        run: |
          {
            echo '<details><summary>doctor output</summary>'
            echo
            echo '```'
            python scripts/tts.py doctor 2>&1 || true
            echo '```'
            echo
            echo '</details>'
          } > diagnostics.md

      - name: Open or update the tracking issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Speech service health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let diagnostics = '';
            try { diagnostics = fs.readFileSync('diagnostics.md', 'utf8'); } catch (e) {}

            const body = [
              'The scheduled probe against the live Edge TTS endpoint failed.',
              '',
              `- **Run:** ${runUrl}`,
              `- **When:** ${new Date().toISOString()}`,
              `- **Commit:** \`${context.sha}\``,
              '',
              'This normally means the undocumented Microsoft endpoint changed, started rate-limiting,',
              'or went away. Check the run log to see which assertion failed.',
              '',
              diagnostics,
            ].join('\n');

            try {
              const { data: open } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const found = open.find(i => i.title === title);

              if (found) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: found.number,
                  body,
                });
                core.info(`Updated existing issue #${found.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
                core.info(`Opened issue #${created.data.number}`);
              }
            } catch (err) {
              core.warning(`Could not file an issue (are Issues enabled?): ${err.message}`);
            }

      - name: Close the tracking issue once healthy again
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Speech service health check failed';
            try {
              const { data: open } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });

              for (const issue of open.filter(i => i.title === title)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Recovered — the probe passes again. Closing automatically.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                core.info(`Closed issue #${issue.number}`);
              }
            } catch (err) {
              core.warning(`Could not close issues: ${err.message}`);
            }

      - name: Fail the run when the probe failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
