name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    env:
      # The CLI prints Chinese; force UTF-8 so piped output is identical
      # on every platform instead of following the Windows code page.
      PYTHONUTF8: "1"
      # GitHub runners sit behind datacenter IPs that Microsoft's undocumented
      # endpoint may refuse; a live-service failure there is not a code defect,
      # so live checks are advisory here. Real outages are caught by the health
      # workflow.
      TTS_SMOKE_REQUIRE_LIVE: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Windows ships SAPI and macOS ships `say`, so only Linux needs a package
      # for the system-voice backend to be testable here.
      - name: Install espeak-ng (Linux system-voice backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng

      # compileall instead of an explicit file list or a *.py glob: PowerShell
      # does not expand wildcards for native commands, and this keeps working
      # when files are added.
      - name: Byte-compile
        run: python -m compileall -q scripts tests

      - name: Report environment
        run: python scripts/tts.py doctor

      - name: Smoke test against the live speech service
        run: python tests/smoke_test.py
